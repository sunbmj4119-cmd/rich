<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KOSPI100">
<title>KOSPI 100 투자 판단</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="ui.css">
<style>
.hhead { display: flex; flex-direction: column; gap: 10px; padding: 6px 4px 4px }
.hhead .top { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.hhead h1 { font-size: 26px; line-height: 1.32 }
.hhead .lead { color: var(--mut); font-size: 15px; line-height: 1.6 }
.todo .li { cursor: pointer }
.todo .tag { width: 52px; flex-shrink: 0; justify-content: center }
.todo .li .s { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.reg-name { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em }
.spark { height: 96px }
.gate { display: flex; flex-direction: column; gap: 8px; background: var(--soft); border-radius: 14px; padding: 14px }
.gate .row { justify-content: space-between; font-size: 14px }
.gate .meter > i { background: var(--up) }
.gate.open .meter > i { background: var(--green) }
.acct-sub { font-size: 14px; color: var(--mut) }
.search { width: 100%; font: inherit; font-size: 15px; padding: 11px 14px; border-radius: 12px; border: 0; background: var(--soft); color: var(--fg) }
.search:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px }
.held-tag { font-size: 11px; font-weight: 700; color: var(--blue); background: var(--down-bg); border-radius: 5px; padding: 1px 6px }
.news a { display: flex; flex-direction: column; gap: 2px; padding-block: 10px; color: inherit }
.news a + a { border-top: 1px solid var(--line) }
.news b { font-weight: 600; font-size: 14.5px; line-height: 1.5 }
.news span { font-size: 12px; color: var(--mut) }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.home-grid { display: flex; flex-direction: column; gap: 12px }
@media (min-width: 900px) {
  .wrap.home { max-width: 1080px }
  .home-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start }
  .col { gap: 16px }
}
.skeleton { height: 120px; border-radius: 20px; background: var(--card); opacity: .6 }
</style>
</head>
<body>
<div class="wrap home">
  <nav class="nav" id="topnav" aria-label="페이지"></nav>
  <header class="hhead">
    <div class="top"><span class="eyebrow" id="asof">불러오는 중…</span><button class="pill" id="fresh" type="button" hidden></button></div>
    <h1 id="headline">&nbsp;</h1>
    <p class="lead" id="lead"></p>
  </header>

  <div class="home-grid" id="grid">
    <div class="col">
      <!-- 오늘 할 일 -->
      <section class="card todo" id="todo-card">
        <header><h2>오늘 할 일</h2><span class="mut" id="todo-n"></span></header>
        <div id="todo"><div class="skeleton"></div></div>
      </section>

      <!-- 시장 -->
      <section class="card" id="mkt">
        <header><span class="eyebrow">지금 시장</span><a class="mut" href="autotrade.html#t-market">자세히 ›</a></header>
        <div class="reg-name"><i class="dot" id="reg-dot"></i><span id="reg"></span></div>
        <p class="mut" id="reg-desc" style="font-size:14px"></p>
        <div class="chart spark" id="spark"></div>
        <div class="facts" id="mkt-facts"></div>
        <div class="gate" id="gate"></div>
      </section>
      <details class="fold" id="news-fold" hidden><summary><div class="sum"><b>시장 뉴스</b><span id="news-sum"></span></div></summary>
        <div class="body news" id="news"></div></details>
    </div>

    <div class="col">
      <!-- 내 계좌 -->
      <section class="card" id="acct">
        <header><span class="eyebrow">내 계좌 · 직접 매매</span><a class="mut" href="trade.html">기록 ›</a></header>
        <div id="acct-body"></div>
      </section>

      <!-- 자동매매 -->
      <a class="card" href="autotrade.html" id="auto" style="color:inherit">
        <header><span class="eyebrow">자동매매 · <span id="auto-broker">모의 계좌</span></span><span class="chev" aria-hidden="true"></span></header>
        <div class="row" style="align-items:baseline;gap:8px;flex-wrap:wrap"><span class="mid-num" id="auto-eq">—</span><span class="mut" id="auto-ret"></span></div>
        <div class="minis" id="auto-counts"></div>
        <p class="mut" id="auto-note" style="font-size:13.5px"></p>
      </a>

      <!-- 종목 순위 -->
      <section class="card" id="rank">
        <header><h2>종목 순위</h2><span class="mut small" id="rank-sub"></span></header>
        <input class="search" id="q" type="search" placeholder="종목 이름 또는 섹터 검색" aria-label="종목 검색" autocomplete="off">
        <div class="chips" id="rank-chips" role="group" aria-label="목록 고르기">
          <button class="chip on" type="button" data-k="all">전체</button>
          <button class="chip" type="button" data-k="held">보유</button>
          <button class="chip" type="button" data-k="up">20일 상승</button>
          <button class="chip" type="button" data-k="down">20일 하락</button>
        </div>
        <div id="rank-list"></div>
      </section>
    </div>
  </div>

  <p class="foot">
    <a href="classic.html">이전 대시보드 보기</a> · 확률·등급표·시나리오 같은 자세한 표는 이전 화면에 있습니다<br>
    과거 통계는 미래를 보장하지 않습니다 · 투자 판단과 책임은 본인에게 있습니다
  </p>
</div>
<script src="ui.js"></script>
<script>
U.nav("index.html");
(async () => {
  let D, A = null;
  try { D = await U.j("data.json"); }
  catch (e) {
    U.$("#headline").textContent = "데이터를 불러오지 못했습니다";
    U.$("#lead").textContent = "잠시 뒤 새로고침해 주세요. (" + e.message + ")";
    U.$("#grid").hidden = true; return;
  }
  try { A = await U.j("autotrade.json"); } catch { A = null; }

  const m = D.market, items = D.items, pf = D.portfolio || {}, rg = (D.regime || {}).current || {};
  const byCode = Object.fromEntries(items.map((i) => [i.code, i]));
  const link = (c) => `stock.html?code=${encodeURIComponent(c)}`;
  const WD = "일월화수목금토";
  const dt = new Date(m.date + "T00:00:00");
  U.$("#asof").textContent = `${dt.getMonth() + 1}월 ${dt.getDate()}일 (${WD[dt.getDay()]}) 종가 기준`;

  // ── 데이터 신선도: 낡은 데이터가 있으면 머리에 알약 하나로 ──
  const stale = [];
  if (m.stale && m.stale.lag > 3) stale.push(`${m.stale.file.replace(".csv", "")} ${m.stale.lag}거래일 지연 — ${m.stale.effect}`);
  if (A && A.flags && A.flags.flow_stale) stale.push(`외국인·기관 수급 ${A.flags.flow_gap}거래일 지연 (마지막 ${A.flags.flow_last}) — 자동매매 신규 매수 보류`);
  const fr = U.$("#fresh");
  fr.hidden = false;
  if (stale.length) {
    fr.className = "pill p-warn"; fr.innerHTML = `<i class="dot d-warn"></i>데이터 지연 ${stale.length}건`;
    fr.addEventListener("click", () => U.sheet("데이터 지연", `<div class="note">${stale.map((s) => `• ${U.esc(s)}`).join("<br>")}</div>
      <p class="guide">수집은 매일 오후 5시에 자동으로 다시 시도합니다. 해결되면 이 표시는 사라집니다.</p>`));
  } else { fr.innerHTML = `<i class="dot d-ok"></i>데이터 최신`; fr.disabled = true; }

  // ── 신호 이름 (이모지 없이) ──
  const SIG = { "🔴손절": ["매도", "손절선 넘음"], "🔵매도": ["매도", "매도 신호"], "🟠부분익절": ["매도", "일부 익절"],
                "🟢유지": ["유지", "보유 유지"], "⏳보유": ["유지", "최소 보유기간"], "🟡매수": ["매수", "매수 후보"] };
  const held = items.filter((i) => i.held).sort((a, b) => (a.pnl ?? 0) - (b.pnl ?? 0));
  const exits = held.filter((i) => (SIG[i.signal] || [])[0] === "매도");
  const g = A && A.gate, decs = (A && A.decisions) || [];
  const eSell = decs.filter((x) => x.state === "매도"), eBuy = decs.filter((x) => x.state === "매수");

  // ── 한 줄 결론 + 오늘 할 일 ──
  const todo = [];
  exits.forEach((i) => todo.push({ st: "매도", t: i.name, s: `${SIG[i.signal][1]} · ${i.reason || U.pct(i.pnl)}`, href: link(i.code) }));
  eSell.forEach((x) => todo.push({ st: "매도", t: x.name, s: `자동매매(모의) · ${x.reason}`, href: "autotrade.html" }));
  eBuy.forEach((x) => todo.push({ st: "매수", t: x.name, s: `자동매매(모의) · ${x.rank}위 · ${x.reason}`, href: "autotrade.html" }));
  if (g && !g.open) todo.push({ st: "관망", t: "신규 매수 쉬기", s: `${g.regime} — ${g.need}이면 다시 삽니다`, href: "autotrade.html" });
  if (A && A.flags && A.flags.flow_stale) todo.push({ st: "관망", t: "수급 데이터 확인", s: `외국인 수급이 ${A.flags.flow_gap}거래일 낡아 매수를 보류합니다`, href: "autotrade.html" });

  let head, lead;
  if (exits.length) { head = `보유 종목 ${exits.length}개를 정리할 때입니다`; lead = `${exits.map((i) => i.name).join(", ")} — 미리 정한 손절·매도 규칙에 걸렸습니다. 규칙은 감정이 끼기 전에 정한 것이니 그대로 따르는 편이 낫습니다.`; }
  else if (eSell.length || eBuy.length) { head = `자동매매가 오늘 ${eBuy.length ? `${eBuy.length}종목 매수` : ""}${eBuy.length && eSell.length ? " · " : ""}${eSell.length ? `${eSell.length}종목 매도` : ""}합니다`; lead = "모의 계좌에서 내일 아침 주문합니다."; }
  else if (g && !g.open) { head = "지금은 새로 사지 않고 기다리는 구간입니다"; lead = `시장이 ${g.regime}입니다. ${g.need}하면 다시 사기 시작합니다. 그 전까지는 순위만 지켜보세요.`; }
  else if (todo.length === 0) { head = "오늘은 할 일이 없습니다"; lead = "보유 종목은 규칙 안에 있고, 새로 살 신호도 없습니다."; }
  else { head = "오늘 확인할 것이 있습니다"; lead = ""; }
  U.$("#headline").textContent = head;
  U.$("#lead").textContent = lead;
  U.$("#todo-n").textContent = todo.length ? `${todo.length}건` : "";
  U.$("#todo").innerHTML = todo.length
    ? todo.map((x) => `<a class="li" href="${x.href}"><span class="st st-${x.st} tag">${x.st === "관망" ? "대기" : x.st}</span>
        <span class="main"><span class="t">${U.esc(x.t)}</span><span class="s">${U.esc(x.s)}</span></span><span class="chev" aria-hidden="true"></span></a>`).join("")
    : `<div class="empty">할 일이 없습니다. 내일 오후 5시에 다시 판단합니다.</div>`;

  // ── 시장 ──
  const regCol = { "강세장": "var(--up)", "회복장": "var(--up)", "횡보장": "var(--watch)", "약세장": "var(--down)", "급락장": "var(--down)" };
  U.$("#reg").textContent = rg.name || (g && g.regime) || "—";
  U.$("#reg-dot").style.background = regCol[rg.name] || "var(--watch)";
  const REG = { "강세장": "지수가 200일선 위, 절반 넘는 종목이 60일선 위 — 추세가 살아 있는 구간", "횡보장": "뚜렷한 방향 없이 오르내리는 구간",
                "약세장": "지수가 200일선 아래로 내려간 하락 추세 구간", "급락장": "100종목 평균이 고점에서 15% 넘게 빠진 구간" };
  U.$("#reg-desc").textContent = [rg.streak ? `${rg.streak}거래일째` : "", REG[rg.name] || ""].filter(Boolean).join(" · ");
  const idx = (D.regime || {}).index || [];
  if (idx.length > 2) {
    const up = idx[idx.length - 1].v >= idx[0].v;
    U.line(U.$("#spark"), { labels: idx.map((p) => p.date), h: 96, left: 4, ticks: 2, yfmt: () => "", tipfmt: (v) => v.toFixed(1),
      series: [{ name: "100종목 지수", data: idx.map((p) => p.v), color: up ? "var(--up)" : "var(--down)", width: 2, end: true, area: true }],
      aria: "최근 6개월 100종목 등가중 지수" });
  } else U.$("#spark").hidden = true;
  U.$("#mkt-facts").innerHTML = [
    ["고점 대비", U.pct(rg.dd), U.cls(rg.dd)],
    ["60일선 위 종목", U.ok(rg.breadth) ? `${Math.round(rg.breadth)}%` : "—", ""],
    ["200일선 대비", U.pct(rg.trend), U.cls(rg.trend)],
    ["변동성(연)", U.ok(rg.vol) ? `${Math.round(rg.vol)}%` : "—", ""],
  ].map(([k, v, c]) => `<div class="fact"><span>${k}</span><b class="${c}">${v}</b></div>`).join("");
  const gt = U.$("#gate");
  if (g) {
    const need = 5, cur = Math.max(0, (g.rebound || 0) * 100);
    gt.classList.toggle("open", !!g.open);
    gt.innerHTML = g.open
      ? `<div class="row"><b><i class="dot d-ok"></i> 신규 매수 가능</b><span class="mut">${U.esc(g.regime)}</span></div><div class="mut small">${U.esc(g.reason)}</div>`
      : `<div class="row"><b>신규 매수 재개까지</b><span class="num"><b>${cur.toFixed(1)}%</b> <span class="mut">/ +${need}% 반등</span></span></div>
         <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="${need}" aria-valuenow="${cur.toFixed(1)}" aria-label="반등 진행"><i style="width:${Math.min(100, (cur / need) * 100)}%"></i></div>
         <div class="mut small">급락장에서는 100종목 지수가 20일 저점보다 5% 이상 오를 때까지 새로 사지 않습니다. 과거 급락장 신규매수는 평균적으로 손해였습니다.</div>`;
  } else gt.hidden = true;
  const news = (m.news || []).slice(0, 6);
  if (news.length) {
    U.$("#news-fold").hidden = false;
    U.$("#news-sum").textContent = news[0].title;
    U.$("#news").innerHTML = news.map((n) => `<a href="${U.esc(n.link)}" target="_blank" rel="noopener"><b>${U.esc(n.title)}</b><span>${U.esc(n.src || "")} · ${U.esc((n.pub || "").slice(5))}</span></a>`).join("");
  }

  // ── 내 계좌 ──
  const ab = U.$("#acct-body");
  if (pf.n > 0) {
    const s10 = (pf.stress || []).find((x) => x.move === -10);
    ab.innerHTML = `<div class="row" style="align-items:baseline;gap:8px;flex-wrap:wrap"><span class="big-num ${U.cls(pf.upnl)}">${pf.upnl > 0 ? "+" : ""}${U.won(pf.upnl)}</span>
        <b class="${U.cls(pf.upnl_pct)}" style="font-size:16px">${U.pct(pf.upnl_pct)}</b></div>
      <div class="acct-sub">투자 ${U.won(pf.invested)} → 지금 ${U.won(pf.value)} · ${pf.n}종목${pf.realized ? ` · 실현 ${U.won(pf.realized)}` : ""}</div>
      <div>${held.map((i) => {
        const sg = SIG[i.signal] || ["유지", "보유"];
        return `<a class="li" href="${link(i.code)}"><span class="main"><span class="t">${U.esc(i.name)} ${sg[0] === "매도" ? `<span class="st st-매도">${sg[1]}</span>` : ""}</span>
          <span class="s">${i.held}일째 · 평단 ${U.won(i.avgp)} · 지금 ${U.won(i.price)}</span></span>
          <span class="r"><b class="${U.cls(i.pnl)}">${U.pct(i.pnl)}</b><span class="mut">종합 ${i.rank}위</span></span><span class="chev" aria-hidden="true"></span></a>`;
      }).join("")}</div>
      ${s10 ? `<div class="note">시장이 30일 안에 10% 빠지면 계좌는 <b class="neg">${U.won(s10.pnl - pf.upnl)}</b> 더 줄어듭니다 (과거 이런 달 ${s10.prob}%).</div>` : ""}
      <div class="actions"><a class="btn ghost" href="trade.html">매매 기록하기</a><a class="btn ghost" href="journal.html">투자 논리 쓰기</a></div>`;
  } else {
    ab.innerHTML = `<div class="empty">기록된 보유 종목이 없습니다.<br>직접 사고판 내역을 적으면 손절·익절 시점을 알려드립니다.
      <a class="btn ghost" href="trade.html">매매 기록하기</a></div>`;
  }

  // ── 자동매매 ──
  if (A) {
    const eq0 = 10000000, eq = A.equity ?? eq0;
    U.$("#auto-broker").textContent = A.broker === "paper" ? "가상 계좌" : A.broker === "kis_demo" ? "한국투자 모의" : A.live ? "실계좌" : "실계좌(주문 꺼짐)";
    U.$("#auto-eq").textContent = U.won(eq);
    U.$("#auto-ret").innerHTML = `<span class="${U.cls(eq - eq0)}">${U.pct((eq / eq0 - 1) * 100)}</span> · 현금 ${Math.round((A.cash / eq) * 100)}%`;
    const c = A.counts || {};
    U.$("#auto-counts").innerHTML = ["매수", "매도", "유지", "관망"].map((k) =>
      `<div class="mini"><b class="${k === "매수" && c[k] ? "up" : k === "매도" && c[k] ? "down" : ""}">${c[k] || 0}</b><span>${k}</span></div>`).join("");
    U.$("#auto-note").textContent = A.gate && !A.gate.open ? `관심 ${decs.length}종목 모두 관망 — ${A.gate.need}을 기다립니다.` : `관심 ${decs.length}종목을 매일 판단합니다.`;
  } else U.$("#auto").hidden = true;

  // ── 종목 순위 ──
  const sorted = items.slice().sort((a, b) => a.rank - b.rank);
  const dmap = Object.fromEntries(decs.map((x) => [x.code, x]));
  U.$("#rank-sub").textContent = "종합점수 순 · 눌러서 분석";
  let mode = "all";
  const row = (i) => {
    const dd = dmap[i.code];
    return `<a class="li" href="${link(i.code)}"><span class="rk">${i.rank}</span>
      <span class="main"><span class="t">${U.esc(i.name)}${i.held ? '<span class="held-tag">보유</span>' : ""}${dd && dd.state !== "관망" ? `<span class="st st-${dd.state}">${dd.state}</span>` : ""}</span>
      <span class="s">${U.esc(i.sector || "")} · 점수 ${U.num(i.score, 1)}</span></span>
      <span class="r"><b>${U.num(i.price)}</b><span class="${U.cls(i.ret20)}">20일 ${U.pct(i.ret20)}</span></span></a>`;
  };
  function draw() {
    const q = U.$("#q").value.trim();
    let L = sorted;
    if (mode === "held") L = L.filter((i) => i.held);
    if (mode === "up") L = L.filter((i) => U.ok(i.ret20)).sort((a, b) => b.ret20 - a.ret20);
    if (mode === "down") L = L.filter((i) => U.ok(i.ret20)).sort((a, b) => a.ret20 - b.ret20);
    if (q) L = L.filter((i) => (i.name + " " + (i.sector || "") + " " + i.code).toLowerCase().includes(q.toLowerCase()));
    const box = U.$("#rank-list");
    if (!L.length) { box.innerHTML = `<div class="empty">${q ? "검색 결과가 없습니다" : "해당 종목이 없습니다"}</div>`; return; }
    U.more(box, L, row, q ? 30 : 10, 20);
  }
  U.$("#rank-chips").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-k]"); if (!b) return;
    mode = b.dataset.k;
    U.$("#rank-chips").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    draw();
  });
  U.$("#q").addEventListener("input", draw);
  draw();
})();
</script>
</body>
</html>
