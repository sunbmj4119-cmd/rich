<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 계좌 계획</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="ui.css">
<style>
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.duo > a { background: var(--soft); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; color: inherit; text-decoration: none; min-width: 0 }
.duo b { font-size: 16px; letter-spacing: -0.02em }
.duo .s { font-size: 13px; color: var(--mut); line-height: 1.5 }
@media (max-width: 380px) { .duo { grid-template-columns: 1fr } }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: st }
.steps li { display: flex; gap: 10px; font-size: 15px; line-height: 1.6 }
.steps li::before { counter-increment: st; content: counter(st); flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--fg); color: var(--bg);
  font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-top: 1px }
.steps.plain li::before { content: "·"; background: none; color: var(--mut); font-size: 18px; width: 12px }
.big-date { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.2 }
.split { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--soft) }
.split > i { display: block; height: 100% }
.alloc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.alloc > div { background: var(--soft); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.alloc b { font-size: 16px }
.alloc .w { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums }
.rrow { display: flex; align-items: center; gap: 10px; padding-block: 9px; border-bottom: 1px solid var(--line) }
.rrow:last-child { border-bottom: 0 }
.rrow .n { width: 22px; text-align: center; font-weight: 800; color: var(--mut); flex-shrink: 0 }
.rrow .nm { flex: 1; min-width: 0; font-weight: 600 }
.rrow .nm small { display: block; font-weight: 400; color: var(--mut); font-size: 12px }
.rrow .v { font-variant-numeric: tabular-nums; font-weight: 700; flex-shrink: 0 }
.bar-in { height: 6px; border-radius: 3px; background: var(--soft); margin-top: 4px; position: relative; overflow: hidden }
.bar-in > i { position: absolute; top: 0; bottom: 0; border-radius: 3px }
.calc { display: grid; grid-template-columns: 1fr; gap: 8px }
.calc label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--mut) }
.calc input { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 0; background: var(--soft); color: var(--fg); font-variant-numeric: tabular-nums; width: 100% }
.calc input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px }
@media (min-width: 560px) { .calc { grid-template-columns: 1fr 1fr 1fr } }
.out { background: var(--soft); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; line-height: 1.7 }
.out b { font-variant-numeric: tabular-nums }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
th { color: var(--mut); font-weight: 600; text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top }
tr.pick td { background: var(--pos-bg) }
tr.pick td:first-child { box-shadow: inset 3px 0 0 var(--green) }
.vd { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap }
.vd-채택 { background: var(--pos-bg); color: var(--green) }
.vd-참고 { background: var(--warn-bg); color: var(--orange) }
.vd-기각 { background: var(--soft); color: var(--mut) }
.study summary .sum b { font-size: 15px; line-height: 1.45; white-space: normal }
.study summary .sum span { white-space: normal }
.kvs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px }
.kvs > div { background: var(--soft); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0 }
.kvs span { font-size: 11.5px; color: var(--mut) }
.kvs b { font-size: 15px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis }
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.tally > button { border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--soft); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px }
.tally > button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--fg) }
.tally b { font-size: 22px; font-variant-numeric: tabular-nums }
.lock { display: flex; gap: 10px; align-items: flex-start; padding-block: 8px; border-bottom: 1px solid var(--line); font-size: 14px }
.lock:last-child { border-bottom: 0 }
.lock .ic { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; margin-top: 1px }
.lock .ic.y { background: var(--pos-bg); color: var(--green) } .lock .ic.n { background: var(--soft); color: var(--mut) }
.lock .grow small { display: block; color: var(--mut); font-size: 12.5px }
.stock { display: flex; align-items: center; gap: 10px; padding-block: 9px; border-bottom: 1px solid var(--line) }
.stock:last-child { border-bottom: 0 }
.stock .grow, .lock .grow { flex: 1; min-width: 0 }
.stock .grow b { font-weight: 600 }
.stock .grow small { display: block; color: var(--mut); font-size: 12px }
.stock .r { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; flex-shrink: 0 }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" id="topnav" aria-label="페이지"></nav>
  <header class="phead"><h1>내 계좌 계획</h1><div class="mut small" id="sub">불러오는 중…</div></header>

  <section class="card" id="hero"><div class="skeleton" style="height:110px"></div></section>

  <div class="stick"><div class="tabs" id="tabs">
    <button data-t="isa">ISA · 내가</button><button data-t="toss">토스 · 자동</button><button data-t="res">연구 결과</button>
  </div></div>

  <!-- ISA ─────────────────────────────── -->
  <div class="tabpane" data-tab="isa">
    <section class="card" id="isa-todo"><div class="skeleton" style="height:120px"></div></section>
    <section class="card" id="isa-plan"></section>
    <section class="card" id="isa-rot"></section>
    <section class="card" id="isa-calc">
      <header><h2>내 숫자로 계산</h2><span class="mut small">이 기기에만 저장 · 어디에도 보내지 않음</span></header>
      <div class="calc">
        <label>핵심(고배당) 평가금액<input id="c-core" inputmode="numeric" placeholder="예: 500000"></label>
        <label>회전 ETF 평가금액 (지금 들고 있는 것 합계)<input id="c-rot" inputmode="numeric" placeholder="예: 480000"></label>
        <label>예수금 (주식모으기에 쓸 돈은 빼고)<input id="c-cash" inputmode="numeric" placeholder="예: 100000"></label>
      </div>
      <div class="out" id="c-out">세 칸을 채우면 회전 몫을 무엇을 몇 주로 맞출지 계산합니다. 핵심은 주식모으기가 삽니다.</div>
    </section>
    <section class="card" id="isa-etf"></section>
    <section class="card" id="isa-hist"></section>
    <details class="fold"><summary><div class="sum"><b>세금 · 지킬 것</b><span>ISA 를 쓰는 이유와 하지 않는 것</span></div></summary>
      <div class="body" id="isa-tax"></div></details>
  </div>

  <!-- 토스 ─────────────────────────────── -->
  <div class="tabpane" data-tab="toss">
    <section class="card" id="t-real"><div class="skeleton" style="height:120px"></div></section>
    <section class="card" id="t-aggr"></section>
    <section class="card" id="t-cands"></section>
    <section class="card" id="t-trend"></section>
    <details class="fold"><summary><div class="sum"><b>왜 토스는 이렇게</b><span>ISA 로 못 하는 것 · 바꾸는 조건</span></div></summary>
      <div class="body" id="t-why"></div></details>
  </div>

  <!-- 연구 결과 ─────────────────────────── -->
  <div class="tabpane" data-tab="res">
    <section class="card" id="r-top"><div class="skeleton" style="height:100px"></div></section>
    <div id="r-list" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>
  <p class="guide" style="text-align:center;padding:8px 0 4px">과거 기록으로 잰 값이며 앞날을 약속하지 않습니다. 주문은 ISA 는 직접, 토스는 잠금이 다 풀린 뒤에만 시스템이 냅니다.</p>
</div>

<script src="ui.js"></script>
<script>
(async () => {
  const { esc, ok, num, won, $ } = U;
  U.nav("plan.html");
  const P = (v, d = 1, s = true) => (ok(v) ? U.pct(v * 100, d, s) : "—");
  const C = (v) => (ok(v) ? (v > 0 ? "pos" : v < 0 ? "neg" : "") : "");
  const eok = (v) => (ok(v) ? (v >= 1e8 ? `${num(v / 1e8, v >= 1e10 ? 0 : 1)}억` : `${num(v / 1e4, 0)}만`) : "—");
  const md = (s) => { if (!s) return "—"; const d = new Date(s + "T00:00:00"); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`; };
  const load = async (f) => { try { return await U.j(f); } catch { return null; } };
  const [isa, toss, res] = await Promise.all([load("isa.json"), load("toss.json"), load("research_all.json")]);
  $("#sub").textContent = `ISA 는 내가 따라 하고, 토스는 시스템이 자동으로 · 자료 ${isa?.data_until || "—"} 장 마감 기준 · 매일 갱신`;

  /* ── 맨 위 한눈에 ── */
  {
    const act = isa?.is_action_day;
    const rv = toss?.readiness?.verdict || "—";
    const tf = toss?.aggr_div?.forward || {};
    $("#hero").innerHTML = `<header><h2>한눈에</h2><span class="mut small">${esc(isa?.generated || "")}</span></header>
      <div class="duo">
        <a href="#isa" data-go="isa"><span class="eyebrow">ISA · 미래에셋 (내가)</span>
          <b>${act ? `${esc(md(isa.next_day))} 할 일 있음` : "할 일 없음 · 들고 있기"}</b>
          <span class="s">${act ? "이번 달 첫 거래일 — 아래 순서대로" : `다음 할 일 ${esc(md(isa?.next_action_day))}`}</span></a>
        <a href="#toss" data-go="toss"><span class="eyebrow">토스 · 종합계좌 (자동)</span>
          <b>실제 주문 ${rv === "준비됨" ? "가능" : "잠김"} <span class="badge ${rv === "준비됨" ? "b-ok" : "b-mut"}">준비도 ${esc(rv)}</span></b>
          <span class="s">공격 고배당 모의 ${tf.days ? `${tf.days}일 · ${P(tf.ret)}` : `${esc(md(tf.start))} 시작`}</span></a>
      </div>`;
  }
  const tb = U.tabs($("#tabs"), "plan");
  document.querySelectorAll("[data-go]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); tb.show(a.dataset.go, true); }));

  /* ════════ ISA ════════ */
  if (!isa) { $("#isa-todo").innerHTML = `<p class="mut">ISA 안내 자료(isa.json)를 아직 못 만들었습니다.</p>`; }
  else {
    const nm = {}; (isa.etfs || []).forEach((e) => (nm[e.code] = e.name));
    const act = isa.is_action_day;
    $("#isa-todo").innerHTML = `<header><h2>${act ? "다음 거래일 할 일" : "지금 할 일"}</h2>${act ? '<span class="badge b-ref">할 일 있음</span>' : '<span class="badge b-ok">없음</span>'}</header>
      <div><div class="big-date">${esc(md(act ? isa.next_day : isa.next_action_day))}</div>
        <div class="mut" style="font-size:13.5px">${act ? "이번 달 첫 거래일 · 10:00 ~ 14:30 사이" : "다음에 앱을 열 날 (이번 달 첫 거래일에 다시 안내 · 공휴일이면 그다음 거래일)"}</div></div>
      <ol class="steps ${act ? "" : "plain"}">${(isa.todo || []).map((t) => `<li><span>${esc(t.replace(/^[①-⑨]\s*/, ""))}</span></li>`).join("")}</ol>
      ${act ? "" : `<div class="note">매달 첫 거래일 한 번만 봅니다. 그 사이 오르내림에는 아무것도 하지 않는 것이 계획입니다 (과거 기록에서 자주 손대면 비용·실수로 나빠졌습니다).</div>`}`;

    const pl = isa.plan || {};
    const core = pl.core || {}, rot = isa.rotation || {};
    $("#isa-plan").innerHTML = `<header><h2>계획 — 반은 오래 들고, 반은 매달 갈아타기</h2><span class="badge b-ok">${esc(pl.picked || "")}</span></header>
      <div class="split" aria-hidden="true"><i style="width:50%;background:var(--up)"></i><i style="width:50%;background:var(--down)"></i></div>
      <div class="alloc">
        <div><span class="eyebrow">핵심 · 고배당</span><span class="w">50%</span><b>${esc(core.name || "PLUS 고배당주")}</b>
          <span class="mut small">${esc(core.code || "")} · <b>주식모으기로 자동</b> (매달 넣는 돈의 절반) · 분배금 재투자 · 떨어져도 안 팜${core.have ? "" : " · 앱에서 못 찾으면 " + esc(nm[core.alt] || "KODEX 고배당") + " (" + esc(core.alt || "") + ")"}</span></div>
        <div><span class="eyebrow">회전 · 매달 1·2등</span><span class="w">50%</span><b>${(rot.held || []).map((x) => esc(x.name)).join(" + ") || "—"}</b>
          <span class="mut small">${esc(md(rot.held_since))}에 고름 · 6개 중 120일 수익 상위 2개 반반, 단기채보다 못하면 단기채</span></div>
      </div>
      <ol class="steps plain">${(pl.rules || []).map((r) => `<li><span>${esc(r)}</span></li>`).join("")}</ol>`;

    const rk = rot.rank || [];
    const cr = rot.cash_r120;
    const mx = Math.max(0.05, ...rk.map((r) => Math.abs(r.r120 || 0)));
    const heldSet = new Set((rot.held || []).map((x) => x.code));
    const wouldTxt = (rot.would_now || []).map((x) => `${esc(x.name)} ${Math.round(x.w * 100)}%`).join(" · ");
    const same = JSON.stringify((rot.would_now || []).map((x) => x.code).sort()) === JSON.stringify((rot.held || []).map((x) => x.code).sort());
    $("#isa-rot").innerHTML = `<header><h2>회전 몫 — 지금 순위</h2><span class="mut small">최근 120거래일 수익 · ${esc(isa.data_until)}</span></header>
      <div>${rk.map((r, i) => `<div class="rrow"><span class="n">${i + 1}</span>
        <div class="nm">${esc(r.name)}${heldSet.has(r.code) ? ' <span class="badge b-ok">들고 있음</span>' : ""}<small>${r.beats_cash ? "단기채보다 나음" : "단기채보다 못함 → 이 자리면 단기채"}</small>
          <div class="bar-in"><i style="${r.r120 >= 0 ? `left:50%;width:${(r.r120 / mx) * 50}%;background:var(--up)` : `right:50%;width:${(-r.r120 / mx) * 50}%;background:var(--down)`}"></i></div></div>
        <span class="v ${C(r.r120)}">${P(r.r120)}</span></div>`).join("")}
        <div class="rrow"><span class="n">·</span><div class="nm">KODEX 단기채권 (기준)<small>이보다 못한 자리는 단기채로</small></div><span class="v">${P(cr)}</span></div></div>
      <div class="note">${same ? "지금 순위로도 들고 있는 것과 같습니다." : `<b>지금 순위대로라면</b> ${wouldTxt} — 하지만 바꾸는 것은 <b>${esc(md(isa.next_action_day))}</b> (다음 달 첫 거래일) 순위로 정합니다. 그 전에는 그대로 둡니다.`}</div>`;

    // 내 숫자로 계산 (localStorage 만)
    const KEY = "rich.isa.calc.v2";
    const px = {}; (isa.etfs || []).forEach((e) => { if (e.have) px[e.code] = e.price; });
    const inputs = ["c-core", "c-rot", "c-cash"].map((id) => $("#" + id));
    try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); inputs.forEach((el) => { if (s[el.id]) el.value = s[el.id]; }); } catch { /* 저장 없음 */ }
    const val = (el) => +String(el.value).replace(/[^0-9.]/g, "") || 0;
    const calc = () => {
      const [vc, vr, cash] = inputs.map(val);
      try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(inputs.map((el) => [el.id, el.value])))); } catch { /* 저장 불가 */ }
      if (!(vc || vr || cash)) { $("#c-out").textContent = "세 칸을 채우면 회전 몫을 무엇을 몇 주로 맞출지 계산합니다. 핵심은 주식모으기가 삽니다."; return; }
      const tot = vc + vr + cash;
      const lines = [`전체 <b>${won(tot)}</b> · 핵심 ${P(vc / tot, 0, false)} · 회전 ${P(vr / tot, 0, false)} · 예수금 ${P(cash / tot, 0, false)}`];
      const order = (rot.rank || []).map((r) => r.code);
      const tgt = (act ? (rot.next || []) : (rot.held || [])).slice().sort((x, y) => (order.indexOf(x.code) + 1 || 99) - (order.indexOf(y.code) + 1 || 99));
      const base = vr + cash;
      let left = base;
      const parts = tgt.map((x) => {
        const p = px[x.code], amt = base * x.w;
        if (!p) return `${esc(x.name)} ${won(amt)} 어치 (가격 자료 없음 — 앱 가격으로 나눔)`;
        const q = Math.floor(Math.min(amt, left) / p);
        left -= q * p;
        return q > 0 ? `${esc(x.name)} <b>모두 합쳐 ${q}주</b> (${won(p)} · ${won(q * p)})` : `${esc(x.name)} <b>아직 1주 안 됨</b> (1주 ${won(p)} > ${won(amt)}) — 모아 둠`;
      });
      lines.push(`회전 몫 ${won(base)} (들고 있는 것 + 예수금) → ${parts.join(" · ") || "—"} · 남는 돈 ${won(left)}`);
      lines.push(`<span class="mut">'모두 합쳐 N주' = 판 뒤 · 산 뒤 그 ETF 를 N주 들고 있게. 순위 밖 ETF 는 0주 (전부 판다).</span>`);
      if (!act) lines.push(`<span class="mut">오늘은 할 일 없는 날 — 이 계산은 ${esc(md(isa.next_action_day))}에 씁니다.</span>`);
      if (vc / tot > 0.6 || (vr + cash) / tot > 0.6) lines.push(`<b>한쪽이 60% 를 넘음</b> — 1월 첫 거래일이면 넘는 만큼 팔아 50:50 으로 (또는 주식모으기 금액을 잠시 조정).`);
      $("#c-out").innerHTML = lines.join("<br>");
    };
    inputs.forEach((el) => el.addEventListener("input", calc));
    calc();

    // ETF 표
    const et = isa.etfs || [];
    const row = (e) => `<tr><td><b>${esc(e.name)}</b><div class="mut small">${esc(e.code)} · ${esc(e.note || e.group || "")}</div></td>
      ${e.have ? `<td class="num">${num(e.price)}</td><td class="num ${C(e.r1m)}">${P(e.r1m)}</td><td class="num ${C(e.r6m)}">${P(e.r6m)}</td><td class="num ${C(e.r12m)}">${P(e.r12m)}</td>
      <td class="num neg">${P(e.mdd1y, 0)}</td><td class="num">${P(e.vol1y, 0, false)}</td><td class="num">${eok(e.value20)}</td><td>${e.above200 === null ? "—" : e.above200 ? "위" : "아래"}</td>`
        : `<td colspan="8" class="mut">자료 없음 — 다음 수집 때 채워집니다 (코드가 바뀌었으면 여기 이름이 다르게 나옵니다)</td>`}</tr>`;
    const grp = (t, list) => list.length ? `<tr><td colspan="9" style="background:var(--soft);font-weight:700">${t}</td></tr>${list.map(row).join("")}` : "";

    const cnt = (v) => it.filter((x) => x.verdict === v).length;
    let flt = "";
    $("#r-top").innerHTML = `<header><h2>지금까지 연구 ${it.length}개</h2><span class="mut small">${esc(res.generated || "")}</span></header>
      <p style="font-size:14.5px;line-height:1.65;margin:0">${esc(res.lead || "")}</p>
      <div class="tally">${["채택", "참고", "기각"].map((v) => `<button type="button" data-v="${v}" aria-pressed="false"><span class="vd vd-${v}" style="align-self:flex-start">${v}</span><b>${cnt(v)}</b></button>`).join("")}</div>
      <p class="guide">채택 = 지금 계좌에 쓰는 것 · 참고 = 일부만 쓰거나 확신 부족 · 기각 = 검증에서 떨어짐. 칸을 누르면 그것만 봅니다.</p>`;
    const draw = () => {
      const list = it.filter((x) => !flt || x.verdict === flt);
      $("#r-list").innerHTML = list.map((x) => `<details class="fold study"><summary><span class="vd vd-${esc(x.verdict)}">${esc(x.verdict)}</span><div class="sum"><b>${esc(x.title)}</b><span>${esc(x.date || "")}${x.src ? " · " + esc(x.src) : ""}</span></div></summary>
        <div class="body"><p style="margin:0;font-size:14px;color:var(--mut)">${esc(x.q || "")}</p><p style="margin:0;font-size:14.5px;line-height:1.7">${esc(x.result || "")}</p>
        ${(x.nums || []).length ? `<div class="kvs">${x.nums.map((n) => `<div><span>${esc(n.k)}</span><b>${esc(n.v)}</b></div>`).join("")}</div>` : ""}
        ${x.used_now ? `<div class="note"><b>지금 쓰는 곳</b> ${esc(x.used_now)}</div>` : ""}</div></details>`).join("");
    };
    $("#r-top").querySelectorAll(".tally button").forEach((b) => b.addEventListener("click", () => {
      flt = flt === b.dataset.v ? "" : b.dataset.v;
      $("#r-top").querySelectorAll(".tally button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === flt)));
      draw();
    }));
    draw();
  }
})();
</script>
</body>
</html>
