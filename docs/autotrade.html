<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>자동매매 판단</title>
<link rel="stylesheet" href="ui.css">
<style>
.gate { border-left: 5px solid var(--watch) } .gate.open { border-left-color: var(--buy) } .gate.shut { border-left-color: var(--sell) }
.cnt { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
.cnt div { background: var(--card); border-radius: 14px; padding: 12px 6px; text-align: center }
.cnt b { display: block; font-size: 24px; font-variant-numeric: tabular-nums }
.cnt span { font-size: 12px; color: var(--mut) }
.dec { padding-block: 12px; cursor: pointer }
.dec .why { font-size: 13px; color: var(--mut); margin-top: 3px; word-break: keep-all }
.dec .need { font-size: 13px; margin-top: 4px; color: var(--orange) }
.dec .det { display: none; margin-top: 8px; font-size: 13px; background: var(--soft); border-radius: 10px; padding: 10px }
.dec.on .det { display: block }
.ck { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0 }
.ck i { font-style: normal; font-size: 11px; color: var(--mut) }
.heat td { text-align: right }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" aria-label="페이지">
    <a href="index.html">대시보드</a><a class="on" href="autotrade.html">자동매매</a><a href="stock.html">종목 분석</a>
    <a href="report.html">성과 보고서</a><a href="features.html">기능 고르기</a>
  </nav>
  <h1>자동매매 판단</h1>
  <div class="mut" id="sub">불러오는 중…</div>
  <div id="warns" style="display:flex;flex-direction:column;gap:8px"></div>

  <section class="card gate" id="gate"></section>
  <div class="cnt" id="cnt" data-feat="market_score"></div>

  <section class="card" data-feat="sector_heatmap">
    <header><h2>섹터 히트맵</h2><span class="mut small">평균 등락 · 평균 종합점수 · 10위 안 종목 수</span></header>
    <div class="scroll"><table class="heat" id="sec"></table></div>
  </section>

  <div id="lists" style="display:flex;flex-direction:column;gap:12px"></div>

  <section class="card">
    <h2>계좌</h2>
    <div id="acct"></div>
    <a class="small" href="report.html">실전(모의) 추적과 성과 보고서 →</a>
  </section>

  <section class="card" data-feat="trade_journal">
    <header><h2>자동 매매일지</h2><span class="mut small">최근 40건</span></header>
    <div class="scroll"><table id="journal"></table></div>
  </section>

  <section class="card">
    <h2>검증 요약</h2>
    <div class="scroll"><table id="bt"></table></div>
    <p class="guide">엔진 백테스트 · 비용 왕복 0.3% · 다음 날 종가 체결 · 가설 성과입니다. 규칙의 근거와 탈락한 지표는 STRATEGY.md에 있습니다.</p>
  </section>
</div>
<script src="ui.js"></script>
<script>
(async () => {
  const [d, A] = await Promise.all([U.j("autotrade.json"), U.j("analytics.json").catch(() => null), U.feat.load()]);
  const ICON = { "매도": "🔴", "매수": "🟢", "유지": "🔵", "관망": "⚪" };
  U.$("#sub").textContent = `기준일 ${d.asof} · ${d.broker}${d.live ? " (실주문)" : ""} · 주문 방식 ${d.approval === "manual" ? "승인 후 주문" : "자동"} · 생성 ${d.generated.slice(0, 16).replace("T", " ")}`;

  const w = [...d.issues];
  if (d.flags.flow_stale) w.push(`수급 데이터가 ${d.flags.flow_last} 이후 ${d.flags.flow_gap}거래일 비어 있어 신규매수를 보류합니다 (KRX 수집 확인 필요).`);
  if (d.flags.account_halt) w.push(d.flags.account_halt);
  if (d.paused) w.push("신규 매수 일시정지 중입니다 (config/PAUSE). 손절·익절 매도는 계속합니다. 해제: autotrade-control → resume");
  if (d.plan_status === "승인 대기") w.push(`주문 ${d.orders.length}건이 승인을 기다립니다. GitHub 앱 → Actions → autotrade-control → approve (뺄 종목코드는 skip 칸에)`);
  U.$("#warns").innerHTML = w.map((x) => `<div class="warn">⚠️ ${U.esc(x)}</div>`).join("");

  const g = d.gate;
  const gEl = U.$("#gate");
  gEl.classList.add(g.open ? "open" : "shut");
  gEl.innerHTML = `<h2>시장 게이트 — ${g.open ? "신규매수 열림" : "신규매수 닫힘"}</h2><div>${U.esc(g.reason)}</div>
    ${g.need ? `<div style="color:var(--orange);font-size:13.5px">열리는 조건: ${U.esc(g.need)}</div>` : ""}
    <div class="mut">지수/200일선 ${U.ok(g.trend) ? U.pct(g.trend * 100) : "—"} · 60일선 위 종목 ${U.ok(g.breadth) ? Math.round(g.breadth * 100) + "%" : "—"} · 고점대비 ${U.ok(g.dd) ? U.pct(g.dd * 100) : "—"}</div>`;
  U.$("#cnt").innerHTML = ["매도", "매수", "유지", "관망"].map((s) => `<div><b>${d.counts[s]}</b><span>${ICON[s]} ${s}</span></div>`).join("");

  if (A) {
    U.$("#sec").innerHTML = `<tr><th>섹터</th><th>종목</th><th>오늘</th><th>20일</th><th>평균점수</th><th>10위 안</th></tr>` +
      A.sectors.map((x) => `<tr><td>${U.esc(x.sector)}</td><td>${x.n}</td><td style="${U.heatBg(x.ret1, 4)}">${U.pct(x.ret1)}</td>
        <td style="${U.heatBg(x.ret20, 20)}">${U.pct(x.ret20)}</td><td>${U.num(x.score, 1)}</td><td>${x.top10 || ""}</td></tr>`).join("");
  }

  const L = U.$("#lists");
  for (const s of ["매도", "매수", "유지", "관망"]) {
    const xs = d.decisions.filter((x) => x.state === s);
    if (!xs.length) continue;
    L.insertAdjacentHTML("beforeend", `<section class="card"><h2>${ICON[s]} ${s} (${xs.length})</h2><div class="list">${xs.map((x) => {
      const o = d.orders.find((o) => o.code === x.code);
      const ck = (x.checks || []).map((c) => `<div class="ck"><span>${c.ok ? "✅" : "❌"} ${U.esc(c.label)} <i>${U.esc(c.tier)}</i></span><span>${U.esc(c.value)}</span></div>`).join("");
      const rf = (x.ref?.items || []).map((r) => `<div class="ck"><span>${r.good ? "＋" : "－"} ${U.esc(r.label)} <i>${U.esc(r.source)}</i></span><span>${U.esc(r.value)}</span></div>`).join("");
      const band = A && A.stocks[x.code] && A.stocks[x.code].band;
      return `<div class="dec"><div class="row" style="flex-wrap:wrap;gap:8px"><span class="st st-${s}">${s}${x.action ? " · " + U.esc(x.action) : ""}</span>
          <a href="stock.html#c${x.code}" onclick="event.stopPropagation()"><b>${U.esc(x.name)}</b></a><span class="mut">${x.rank ?? "권외"}위 · ${U.esc(x.sector)} · ${U.won(x.price)}</span></div>
        <div class="why">${U.esc(x.reason)}</div>
        ${o ? `<div class="why">주문: ${o.side === "buy" ? "매수" : "매도"} ${o.qty}주 ${o.kind === "limit" ? "지정가 " + U.won(o.price) : "시장가"}</div>` : ""}
        ${x.need && x.need.length ? `<div class="need">매수로 넘어가려면: ${x.need.map(U.esc).join(" / ")}</div>` : ""}
        <div class="det"><b>결정 조건</b>${ck}
          ${band ? `<div class="ck" data-feat="forecast_band"><span>30일 뒤 범위 (10번 중 8번)</span><span>${U.won(band.price[0])} ~ ${U.won(band.price[4])}</span></div>` : ""}
          <br><b>참고 지표</b> <span class="mut">(결정에 쓰지 않음 — 검증 탈락)</span>${rf}</div></div>`;
    }).join("")}</div></section>`);
  }
  L.addEventListener("click", (e) => { const r = e.target.closest(".dec"); if (r) r.classList.toggle("on"); });

  U.$("#acct").innerHTML = `<div class="kpis"><div class="kpi"><span>평가액</span><b>${U.won(d.equity)}</b></div>
    <div class="kpi"><span>현금</span><b>${U.won(d.cash)}</b></div><div class="kpi"><span>고점대비</span><b>${U.pct(d.drawdown * 100)}</b></div>
    <div class="kpi"><span>기록 일수</span><b>${(d.equity_curve || []).length}일</b></div></div>`;

  const j = d.journal || [];
  U.$("#journal").innerHTML = j.length ? `<tr><th>날짜</th><th>구분</th><th>종목</th><th>수량</th><th>가격</th><th>이유</th><th>순위</th><th>국면</th><th>승인</th></tr>` +
    j.map((x) => `<tr><td>${x.date}</td><td>${x.side === "buy" ? "매수" : "매도"}</td><td><a href="stock.html#c${String(x.code).padStart(6, "0")}">${U.esc(x.name)}</a></td>
      <td>${x.qty}</td><td>${U.won(x.price)}</td><td class="wrap-cell">${U.esc(x.reason)}</td><td>${x.rank || ""}</td><td>${U.esc(x.regime)}</td><td>${x.approved_by === "approve" ? "승인" : "자동"}</td></tr>`).join("")
    : `<tr><td class="mut">아직 주문이 없습니다. 첫 주문부터 이유와 당시 근거가 쌓입니다.</td></tr>`;

  const bt = d.backtest || {};
  U.$("#bt").innerHTML = `<tr><th></th><th>2019~23 연</th><th>Sharpe</th><th>MDD</th><th>2024~ 연</th><th>Sharpe</th><th>MDD</th></tr>` +
    Object.entries(bt).map(([k, v]) => `<tr><td>${U.esc(k)}</td><td>${U.pct(v.train.ann)}</td><td>${v.train.sharpe}</td><td>${U.pct(v.train.mdd)}</td><td>${U.pct(v.test.ann)}</td><td>${v.test.sharpe}</td><td>${U.pct(v.test.mdd)}</td></tr>`).join("");
  U.feat.apply();
})().catch((e) => { document.getElementById("sub").textContent = "autotrade.json을 불러오지 못했습니다: " + e.message; });
</script>
</body>
</html>
