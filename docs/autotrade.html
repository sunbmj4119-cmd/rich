<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>자동매매 판단</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--fg:#1d1d1f;--mut:#86868b;--line:#ececf0;
  --buy:#34c759;--hold:#0071e3;--sell:#ff3b30;--watch:#8e8e93;--warn:#ff9500;--soft:#f5f5f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;
  --mut:#98989d;--line:#2c2c2e;--soft:#2c2c2e}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--mut:#98989d;--line:#2c2c2e;--soft:#2c2c2e}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;margin:0;padding:16px;
  background:var(--bg);color:var(--fg);max-width:820px;margin-inline:auto;line-height:1.5}
h1{font-size:22px;margin:4px 0} h2{font-size:16px;margin:0 0 10px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0}
.gate{border-left:5px solid var(--watch)} .gate.open{border-color:var(--buy)} .gate.shut{border-color:var(--sell)}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cnt div{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center}
.cnt b{display:block;font-size:24px} .cnt span{font-size:12px;color:var(--mut)}
.row{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}
.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px}
.t-매수{background:var(--buy)} .t-유지{background:var(--hold)} .t-매도{background:var(--sell)} .t-관망{background:var(--watch)}
.nm{font-weight:700} .why{font-size:13px;color:var(--mut);margin-top:3px;word-break:keep-all}
.need{font-size:13px;margin-top:4px;color:var(--warn)}
.det{display:none;margin-top:8px;font-size:13px;background:var(--soft);border-radius:10px;padding:10px}
.row.on .det{display:block}
.ck{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.ck i{font-style:normal;font-size:11px;color:var(--mut)}
.warn{background:var(--card);border:1.5px solid var(--warn);border-radius:14px;padding:12px;margin:8px 0;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px} td,th{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left}
a{color:var(--hold)} svg{width:100%;height:120px}
</style></head><body>
<a href="index.html" class="mut">← 대시보드</a>
<h1>🤖 자동매매 판단</h1>
<div class="mut" id="sub">불러오는 중…</div>
<div id="warns"></div>
<div class="card gate" id="gate"></div>
<div class="cnt" id="cnt"></div>
<div id="lists"></div>
<div class="card"><h2>계좌</h2><div id="acct"></div><svg id="eq" viewBox="0 0 300 120" preserveAspectRatio="none"></svg></div>
<div class="card"><h2>검증 (engine_backtest.py · 비용 왕복 0.3% · 다음날 종가 체결)</h2><div id="bt"></div>
<p class="mut">과거 성과이지 예보가 아닙니다. 규칙의 근거와 탈락한 지표는 STRATEGY.md에 있습니다.</p></div>
<script>
const S={"매도":"🔴","매수":"🟢","유지":"🔵","관망":"⚪"};
const won=v=>v==null?"-":Math.round(v).toLocaleString("ko-KR")+"원";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("autotrade.json?"+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById("sub").textContent=`기준일 ${d.asof} · ${d.broker}${d.live?" (실주문)":""} · 생성 ${d.generated.slice(0,16).replace("T"," ")}`;
  const w=[...d.issues];
  if(d.flags.flow_stale) w.push(`수급 데이터가 ${d.flags.flow_last} 이후 ${d.flags.flow_gap}거래일 비어 있어 신규매수를 보류합니다 (KRX 수집 확인 필요).`);
  if(d.flags.account_halt) w.push(d.flags.account_halt);
  document.getElementById("warns").innerHTML=w.map(x=>`<div class="warn">⚠️ ${esc(x)}</div>`).join("");
  const g=d.gate;
  document.getElementById("gate").className="card gate "+(g.open?"open":"shut");
  document.getElementById("gate").innerHTML=`<h2>시장 게이트 — ${g.open?"신규매수 열림":"신규매수 닫힘"}</h2>
    <div>${esc(g.reason)}</div>${g.need?`<div class="need">열리는 조건: ${esc(g.need)}</div>`:""}
    <div class="mut">지수/200일선 ${g.trend!=null?(g.trend*100).toFixed(1)+"%":"-"} · 60일선 위 종목 ${g.breadth!=null?(g.breadth*100).toFixed(0)+"%":"-"} · 고점대비 ${g.dd!=null?(g.dd*100).toFixed(1)+"%":"-"}</div>`;
  document.getElementById("cnt").innerHTML=["매도","매수","유지","관망"].map(s=>`<div><b>${d.counts[s]}</b><span>${S[s]} ${s}</span></div>`).join("");
  const L=document.getElementById("lists");
  for(const s of ["매도","매수","유지","관망"]){
    const xs=d.decisions.filter(x=>x.state===s); if(!xs.length) continue;
    L.insertAdjacentHTML("beforeend",`<div class="card"><h2>${S[s]} ${s} (${xs.length})</h2>${xs.map(x=>{
      const o=d.orders.find(o=>o.code===x.code);
      const ck=(x.checks||[]).map(c=>`<div class="ck"><span>${c.ok?"✅":"❌"} ${esc(c.label)} <i>${esc(c.tier)}</i></span><span>${esc(c.value)}</span></div>`).join("");
      const rf=(x.ref?.items||[]).map(r=>`<div class="ck"><span>${r.good?"＋":"－"} ${esc(r.label)} <i>${esc(r.source)}</i></span><span>${esc(r.value)}</span></div>`).join("");
      return `<div class="row" onclick="this.classList.toggle('on')"><div class="top"><span class="tag t-${s}">${s}${x.action?" · "+esc(x.action):""}</span>
        <span class="nm">${esc(x.name)}</span><span class="mut">${x.rank??"권외"}위 · ${esc(x.sector)} · ${won(x.price)}</span></div>
        <div class="why">${esc(x.reason)}</div>
        ${o?`<div class="why">주문: ${o.side==="buy"?"매수":"매도"} ${o.qty}주 ${o.kind==="limit"?"지정가 "+won(o.price):"시장가"}</div>`:""}
        ${x.need&&x.need.length?`<div class="need">매수로 넘어가려면: ${x.need.map(esc).join(" / ")}</div>`:""}
        <div class="det"><b>결정 조건</b>${ck}<br><b>참고 지표</b> <span class="mut">(결정에 쓰지 않음 — 검증 탈락)</span>${rf}</div></div>`}).join("")}</div>`);
  }
  document.getElementById("acct").innerHTML=`평가액 <b>${won(d.equity)}</b> · 현금 ${won(d.cash)} · 고점대비 ${(d.drawdown*100).toFixed(1)}%`;
  const c=d.equity_curve.map(x=>x.equity);
  if(c.length>1){const mn=Math.min(...c),mx=Math.max(...c),r=mx-mn||1;
    document.getElementById("eq").innerHTML=`<polyline fill="none" stroke="var(--hold)" stroke-width="2" vector-effect="non-scaling-stroke" points="${c.map((v,i)=>`${i/(c.length-1)*300},${115-(v-mn)/r*110}`).join(" ")}"/>`;}
  const bt=d.backtest||{};
  document.getElementById("bt").innerHTML=`<table><tr><th></th><th>train 연</th><th>Sharpe</th><th>MDD</th><th>test 연</th><th>Sharpe</th><th>MDD</th></tr>${
    Object.entries(bt).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.train.ann}%</td><td>${v.train.sharpe}</td><td>${v.train.mdd}%</td><td>${v.test.ann}%</td><td>${v.test.sharpe}</td><td>${v.test.mdd}%</td></tr>`).join("")}</table>`;
}).catch(e=>{document.getElementById("sub").textContent="autotrade.json을 불러오지 못했습니다: "+e});
</script></body></html>
