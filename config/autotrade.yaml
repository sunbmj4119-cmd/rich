# 자동매매 설정 — src/autotrader.py 가 읽는다.
# 판단 규칙의 근거는 docs/STRATEGY.md, 검증 재현은 src/engine_lab.py · src/engine_backtest.py
#
# ⚠️ 기본값은 '모의(paper)'입니다. 실계좌 주문은 아래 세 가지가 모두 갖춰져야만 나갑니다.
#    1) broker: kis_real   2) live_trading: true   3) 환경변수 AUTOTRADE_CONFIRM=I_UNDERSTAND
#    하나라도 빠지면 주문 계획만 기록하고 실제 주문은 보내지 않습니다(dry-run).

enabled: true            # false 또는 config/KILL 파일이 있으면 모든 주문 중단 (킬스위치)
broker: paper            # paper | kis_demo(한국투자증권 모의투자) | kis_real(실계좌)
live_trading: false      # kis_real 일 때 실제 주문을 보낼지. false = 계획만 기록

paper:
  initial_cash: 10000000   # 모의 계좌 시작 현금 (원)
  cost: 0.0015             # 편도 비용(수수료+세금+슬리피지) — 백테스트 왕복 0.3%와 일치

# ── 판단 규칙 (백테스트와 같은 값 — 바꾸면 engine_backtest.py로 다시 검증할 것) ──
strategy:
  max_positions: 10        # 동시 보유 종목 수 (검증: 5/10/15 중 10이 train·test 균형)
  entry_rank: 10           # 종합순위 이 안이면 매수 후보
  watch_rank: 20           # 이 안이면 관망 목록에 올림
  exit_rank: 20            # 보유 종목이 이 밖으로 밀리고
  min_hold_days: 30        #   이만큼 들고 있었으면 매도
  stop_loss: 0.10          # 평단 대비 -10% 손절
  trail_base: 0.08         # 고점 대비 -8% 트레일링
  trail_tiers: [[0.30, 0.03], [0.15, 0.05]]   # 고점수익 +30%↑ -3%, +15%↑ -5%
  take_profit_gain: 0.25   # +25% 도달 시
  take_profit_fraction: 0.3333   # 보유의 1/3 부분 익절
  flow_filter: true        # 외국인 20일 순매도 종목은 매수 보류 → 관망
  # 급락장(지수 고점대비 -15%↓)에서는 바닥 확인 전 신규매수 중단 → 관망
  #   engine_lab 검증: 교차확인 Sharpe train 5/7 · test 7/7, MDD 6/7 · 7/7 개선
  #   민감도: 10/20/40일 × 3/5/7/10% 12개 변형 전부 train·test 동시 개선
  crash_gate: true
  crash_rebound_window: 20 # 지수가 최근 N일 최저점 대비
  crash_rebound_min: 0.05  #   이만큼 반등해야 '바닥 확인'
  # 선택 규칙 — 전량 청산한 종목을 N거래일 동안 다시 사지 않음 (Freqtrade CooldownPeriod)
  #   0 = 끔. 검증 결과는 docs/STRATEGY.md '선택 규칙' 참고
  cooldown_days: 0

# ── 모델 진화 (src/evolve.py · 매주 토요일 evolve.yml) ──
#   매주 전체 데이터로 설정을 진화시켜 '도전자'로 등록하고, 등록일 이후 새 데이터로만 챔피언과 맞붙인다.
#   승격된 설정은 config/champion.yaml 에 쓰이고 위 strategy 를 덮어쓴다 (지우면 원래대로).
evolve:
  auto_promote: false      # false = 승격 '제안'만 (autotrade-control → promote 로 승인). true = 조건 통과 시 자동 적용
  min_forward_days: 60     # 길 A: 적응을 신뢰할 때 필요한 전진 시험 기간 (거래일)
  long_forward_days: 250   # 길 B: 적응을 신뢰하지 못해도, 약 1년 전진 시험에서 확실히 이기면 승격 후보
  max_challengers: 6

# ── 단기 모의투자 (src/short_trader.py · 매일 daily.yml) — 30일 자동매매와 별개의 가상 계좌 ──
#   매일 저녁 후보 모델 전부를 다시 시뮬레이션하고, 아래 규칙으로 따라갈 모델을 고른다. 검증: src/short_lab.py · docs/STRATEGY.md 3-7
#   rule: every=몇 거래일마다 다시 고를지 · L=최근 며칠 성적 · how=sharpe(위험조정)|ret(수익) · pool=SLOW|ALL
#   ⚠️ every:1 · how:ret (매일 수익 1등) 은 검증에서 지수 보유보다 나빴다 — 바꾸기 전에 docs/short.html '검증 결과'를 볼 것
short:
  enabled: true
  initial_cash: 10000000
  buy_buffer: 0.02         # 수량 계산 때 어제 종가보다 2% 비싸게 잡는다 (시가 갭 상승 대비)
  rule: {pool: SLOW, every: 5, L: 250, how: sharpe, k: 1, sticky: 0.0}

# ── 안전장치 (수익을 위한 규칙이 아니라 사고를 막는 규칙 — 백테스트에 없음) ──
risk:
  max_position_weight: 0.15     # 한 종목 최대 비중 (평가금액 기준)
  max_order_krw: 3000000        # 1회 주문 최대 금액 (원)
  max_daily_buy_krw: 10000000   # 하루 총 매수 한도 (원)
  max_orders_per_run: 12
  max_account_drawdown: 0.30    # 계좌가 고점 대비 이만큼 빠지면 신규매수 중단 (서킷브레이커)
  cash_buffer: 0.02             # 항상 남겨둘 현금 비율
  max_data_lag_days: 4          # 점수 데이터가 이보다 오래되면 주문 중단 (달력일)
  stale_flow_days: 10           # 수급 데이터가 이보다 오래되면…
  stale_flow_policy: watch      #   watch = 매수 보류(관망) · ignore = 수급 필터 없이 진행
  # 중대 악재 (최근 N일 DART 공시/기사 제목) — 검증 불가(뉴스 이력 1개월)라 '안전장치'로만 사용
  event_lookback_days: 14
  veto_buy_events: "유상증자|전환사채|신주인수권|횡령|배임|분식|상장폐지|관리종목|거래정지|감사의견|불성실공시|감자"
  force_sell_events: "상장폐지|관리종목|거래정지|감사의견\\s?거절|횡령|배임|분식"

execution:
  # auto   = 판단대로 자동 주문
  # manual = 계획만 만들고 '승인 대기' 알림 → GitHub 앱/웹에서 autotrade-control 워크플로우의
  #          approve 실행 시에만 주문 (빼고 싶은 종목은 skip 칸에 종목코드)
  approval: auto
  # 신호는 장 마감 후(17:00) 만들고, 다음 거래일에 체결한다 (백테스트 = t+1 종가 체결).
  buy_order: limit         # limit = 전일종가×(1+buy_slippage) 지정가 · market = 시장가
  buy_slippage: 0.01
  sell_order: market       # 손절·트레일·이탈 매도는 체결이 우선 → 시장가

# ── 알림 (src/notify.py) — 키는 GitHub Secrets 에 넣는다 ──
#   텔레그램: TELEGRAM_BOT_TOKEN · TELEGRAM_CHAT_ID   /   ntfy 앱: NTFY_TOPIC
alerts:
  enabled: false
  channels: [telegram, ntfy]
  # sell=매도 판단 · buy=매수 판단 · fill=체결/주문 결과 · safety=안전장치 발동
  # approval=승인 대기 · daily=매일 요약 (주문 없어도)
  on: [sell, buy, fill, safety, approval, daily]
  page_url: ""               # 대시보드 주소 — 알림 끝에 링크로 붙는다
