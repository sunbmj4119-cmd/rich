name: short-term
# 단기매매 — 손으로 돌릴 때 (매일 실행은 daily.yml 7단계, 매주 검증은 evolve.yml)
#   1) 지수 ETF 일봉 받기 (처음이면 2018년부터)  2) 단기매매 검증 다시 재기  3) 단기 모의투자 한 번 돌리기(같은 날 다시 돌려도 안전)
on:
  workflow_dispatch:
concurrency:
  group: short
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install pandas numpy pyyaml requests "pykrx>=1.2.8"
      - name: 지수 ETF 일봉
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python src/collect_etf.py | tee -a $GITHUB_STEP_SUMMARY
      - name: 단기매매 검증
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          python src/short_lab.py 2>&1 | grep -v Warning | tail -12 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: 단기 모의투자
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          python src/short_trader.py 2>&1 | grep -v Warning | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: 커밋
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/etf_ohlcv.csv data/short/ docs/short.json docs/short_lab.json
          git commit -m "short $(date +%F)" || echo "no change"
          git pull --rebase && git push
