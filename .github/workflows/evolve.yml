name: evolve
# 밤마다 재검증 (2시간마다 도는 연속 진화는 learn.yml)
#   1) 중첩 워크포워드: '그 시점 데이터만으로 진화했다면 실제로 나았나'를 진화 방식 6개 × 시드 3개로 다시 잰다
#   2) 큰 진화 한 번(48 × 14세대, 저장된 인구에서 이어서) → 도전자 등록 → 전진 성적 → 승격 (조건 통과 시 자동)
#   3) 단기매매 검증 전체 (신호 IC · 모델 341개 · 고르는 방식 288가지)
on:
  schedule:
    - cron: "37 17 * * *"   # 매일 02:37 KST (daily-run 17:00 이 끝난 뒤 밤)
  workflow_dispatch:
concurrency:
  group: evolve
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install pandas numpy pyyaml requests
      - name: 빠른 시뮬레이터 = 엔진 대조
        run: python src/evolve.py check | tee -a $GITHUB_STEP_SUMMARY
      - name: 중첩 워크포워드 + 주간 진화
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "## 🧬 모델 진화" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python src/evolve.py all 2>&1 | grep -v Warning | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: 단기매매 검증 (short_lab — 신호 IC · 모델 341개 · 고르는 방식 288가지)
        run: |
          echo "## ⚡ 단기매매 검증" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python src/short_lab.py 2>&1 | grep -v Warning | tail -12 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: 커밋
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/evolve/ docs/evolve.json data/short/lab.json docs/short_lab.json
          git add config/champion.yaml 2>/dev/null || true
          git commit -m "evolve $(date +%F)" || { echo "no change"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 10)); done
          exit 1
