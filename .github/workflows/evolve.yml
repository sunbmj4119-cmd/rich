name: evolve
# 모델 진화 (src/evolve.py) — 매주 토요일
#   1) 중첩 워크포워드: '그 시점 데이터만으로 진화했다면 실제로 나았나'를 진화 방식 6개 × 시드 3개로 다시 잰다
#   2) 전체 데이터로 진화 → 챔피언보다 확실히 나으면 도전자로 등록
#   3) 도전자마다 등록일 이후 새 데이터로만 전진 성적 → 승격 조건 판단 (기본은 제안만, 승인은 autotrade-control → promote)
on:
  schedule:
    - cron: "37 9 * * 6"   # 토요일 18:37 KST (robust-backtest 17:00 다음)
  workflow_dispatch:
concurrency:
  group: evolve
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install pandas numpy pyyaml requests
      - name: 빠른 시뮬레이터 = 엔진 대조
        run: python src/evolve.py check | tee -a $GITHUB_STEP_SUMMARY
      - name: 중첩 워크포워드 + 주간 진화
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "## 🧬 모델 진화" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python src/evolve.py all 2>&1 | grep -v Warning | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: 커밋
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/evolve/ docs/evolve.json config/champion.yaml 2>/dev/null || git add data/evolve/ docs/evolve.json
          git commit -m "evolve $(date +%F)" || echo "no change"
          git pull --rebase && git push
