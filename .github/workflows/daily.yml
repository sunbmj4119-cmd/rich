name: daily-run
on:
  schedule:
    # 평일 17:47 KST (UTC 08:47). GitHub 예약은 몇 시간씩 늦거나 아예 빠진다(10-26 월요일: 실행 없음, 10-27: 23:55 시작)
    #   → 같은 날 세 번 걸어 두고(17:47 · 19:47 · 22:17), 오늘 저녁 이미 끝났으면 뒤의 것은 바로 끝낸다(guard).
    #   learn.yml 도 2시간마다 '오늘 daily 가 빠졌나'를 보고 빠졌으면 이 워크플로우를 직접 실행한다.
    - cron: "47 8 * * 1-5"
    - cron: "47 10 * * 1-5"
    - cron: "17 13 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 이미 돌았어도 다시 실행"
        type: boolean
        default: false
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/daily_done.txt
          sparse-checkout-cone-mode: false
      - id: g
        run: |
          # 같은 '장 마감 회차'를 이미 장 마감 뒤(16시~다음날 9시 KST)에 돌렸으면 건너뜀 (force 를 켜고 손으로 돌리면 언제나 실행).
          # 회차 = KST 시각에서 9시간 뺀 날짜 → 늦게 밀려 자정 넘어 시작한 전날 예약(10-28 → 10-29 00:36·04:01 실행)도 전날 회차로 센다.
          skip=false
          now_s=$(TZ=Asia/Seoul date -d '-9 hours' +%F)
          m=$(cat data/daily_done.txt 2>/dev/null || true)
          ms=$(echo "$m" | sed -n 's/.*session=\([0-9-]*\).*/\1/p')
          mh=$(echo "$m" | sed -n 's/.*kst=[0-9-]* \([0-9][0-9]\):.*/\1/p')
          if [ "${{ inputs.force }}" != "true" ] && [ "$ms" = "$now_s" ] && [ -n "$mh" ] && { [ "$mh" -ge 16 ] || [ "$mh" -lt 9 ]; }; then
            skip=true
          fi
          echo "skip=$skip" >> $GITHUB_OUTPUT
          echo "회차 $now_s · 마지막 기록 [$m] → 건너뜀: $skip"
  run:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install pandas numpy pyyaml "pykrx>=1.2.8" finance-datareader OpenDartReader

      - name: 1) 주가 갱신
        run: python src/update_prices.py

      - name: 1-2) 수급·OHLCV 갱신 (최근 7일)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python src/collect_flows.py || echo "수급 수집 실패(무시하고 계속)"

      - name: 1-2-2) ETF 일봉 12종 (지수·레버리지·인버스·채권·달러·금·미국 — 전천후 모델용, 네이버 우선)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python src/collect_etf.py || echo "ETF 수집 실패(무시하고 계속)"

      - name: 1-3) 업종/섹터 갱신 (fdr, 실패 무시)
        run: python src/collect_sectors.py || echo "업종 수집 실패(무시하고 계속)"

      - name: 2) 점수 계산
        run: python src/score.py

      - name: 3-2) 시장국면 · 베타 (강세/횡보/약세/급락 판정)
        run: python src/regime.py || echo "국면 계산 실패(무시하고 계속)"

      - name: 3-3) 기준집단 통계 (순위밴드 × 국면)
        run: python src/refclass.py || echo "기준집단 계산 실패(무시하고 계속)"

      - name: 3-4) 등급·확률 검증 (미래참조 차단 백테스트)
        run: python src/verify_thesis.py || echo "검증 실패(무시하고 계속)"

      - name: 3-4-2) 포지션 상태별 결과표 (익절·손절 확률)
        run: python src/position_lab.py || echo "포지션 통계 실패(무시하고 계속)"

      - name: 3-5) 종목별 최신 뉴스 + DART 공시
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/news.py || echo "뉴스 수집 실패(무시하고 계속)"

      - name: 4) 상세 데이터 생성 (시나리오·확률 포함)
        run: python src/build_data.py

      - name: 5-2) 종목 분석값 (팩터 등급·기여도·예측 밴드·순위 성적표·섹터)
        run: python src/analytics.py || echo "분석값 계산 실패(무시하고 계속)"

      - name: 5-3) 성과 보고서 (격자는 주 1회 robust.yml 에서)
        run: python src/tearsheet.py --no-grid || echo "성과 보고서 실패(무시하고 계속)"

      - name: 6) 자동매매 판단 (매수/유지/매도/관망 → 주문 계획 · 모의계좌 체결)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          KIS_ACCOUNT_PRODUCT: ${{ secrets.KIS_ACCOUNT_PRODUCT }}
        run: |
          echo "## 🤖 자동매매 판단" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python src/autotrader.py --phase decide 2>&1 | tee -a $GITHUB_STEP_SUMMARY || echo "자동매매 판단 실패(무시하고 계속)"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 7) 모의투자 단기 50 + 전천후 50 (어제 계획 체결 → 후보 모델 재시뮬레이션 · 국면 판정 → 내일 계획)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "## ⚡ 단기 모의투자" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python src/short_trader.py 2>&1 | grep -v Warning | tee -a $GITHUB_STEP_SUMMARY || echo "단기 모의투자 실패(무시하고 계속)"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 8) 자동매매 해설 (무엇을 왜 했나 · 무엇을 얼마나 봤나 → docs/explain.json)
        run: python src/explain.py 2>&1 | grep -v Warning | tee -a $GITHUB_STEP_SUMMARY || echo "해설 실패(무시하고 계속)"

      - name: 5) 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          echo "session=$(TZ=Asia/Seoul date -d '-9 hours' +%F) kst=$(TZ=Asia/Seoul date '+%F %H:%M')" > data/daily_done.txt
          git add data/ docs/
          git commit -m "daily $(TZ=Asia/Seoul date -d '-9 hours' +%Y-%m-%d)" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep $((i * 10)); done
          exit 1
