name: autotrade-execute
# 전날 17:00 daily.yml이 만든 주문 계획(data/autotrade/plan.json)을 증권사에 전송한다.
# config/autotrade.yaml 의 broker 가 kis_demo / kis_real 일 때만 의미가 있다 (paper는 daily에서 끝남).
# 실계좌(kis_real)는 live_trading:true + 저장소 변수 AUTOTRADE_CONFIRM=I_UNDERSTAND 가 모두 있어야 전송.
on:
  schedule:
    # 08:40 KST (UTC 23:40, 일~목 = 한국 월~금). GitHub 예약 실행은 10~20분 늦을 수 있다.
    - cron: "40 23 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "주문을 보내지 않고 계획만 확인"
        type: boolean
        default: true
concurrency:
  group: autotrade
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install pandas numpy pyyaml requests
      - name: 주문 실행
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
          KIS_ACCOUNT_PRODUCT: ${{ secrets.KIS_ACCOUNT_PRODUCT }}
          AUTOTRADE_CONFIRM: ${{ vars.AUTOTRADE_CONFIRM }}
        run: |
          FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          echo "## 🤖 주문 실행" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python src/autotrader.py --phase execute $FLAG 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: 주문 기록 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/autotrade/ || true
          git commit -m "autotrade orders $(date +%Y-%m-%d)" || echo "no changes"
          git pull --rebase
          git push
