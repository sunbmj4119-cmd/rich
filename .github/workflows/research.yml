name: research
# 연구용 — 손으로 돌린다. 네이버 접속 점검 · ETF 전체 기간 받기 · 전천후(국면 스위칭) 연구 → 결과를 돌린 브랜치에 커밋
on:
  workflow_dispatch:
    inputs:
      task:
        description: "etf = ETF 전체 기간 받기 · allweather = 전천후 연구"
        type: choice
        options: [etf, allweather]
        default: etf
concurrency:
  group: research-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install pandas numpy pyyaml requests
      - name: 네이버 접속 점검
        run: python src/naver.py --selftest | tee -a $GITHUB_STEP_SUMMARY
      - name: ETF 전체 기간 (네이버)
        if: inputs.task == 'etf'
        run: python src/collect_etf.py --backfill | tee -a $GITHUB_STEP_SUMMARY
      - name: 전천후 연구
        if: inputs.task == 'allweather'
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          python src/allweather_lab.py 2>&1 | grep -v Warning | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: 커밋
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/etf_ohlcv.csv data/short/ docs/ 2>/dev/null || true
          git commit -q -m "research ${{ inputs.task }} $(date -u +%F' '%H:%M)" || { echo "no change"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && exit 0; sleep $((i * 10)); done
          exit 1
